allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# pnpm's supply-chain policy blocks packages published < 24h ago. The framework
# packages this project deliberately tracks at their latest versions are exempted;
# everything else keeps the default cooling-off period.
minimumReleaseAgeExclude:
  - "@mastra/*"
  - mastra
  - ai
  - "@ai-sdk/*"
  - next
  - "@next/*"
  - eslint-config-next
